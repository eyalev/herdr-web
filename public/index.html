<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: keyboard shrinks the LAYOUT viewport,
     so the flex column compresses and the terminal stays visible above the
     input (default resizes-visual pans the page and hides the terminal). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1117">
<title>herdr-web</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --fg: #e6edf3; --fg-dim: #8b949e;
    --accent: #2f81f7; --border: #30363d;
    --st-working: #3fb950; --st-blocked: #f0883e; --st-done: #2f81f7;
    --st-idle: #6e7681; --st-unknown: #484f58;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  /* ---- tab bar ---- */
  /* Tabs scroll in their own strip; conn dot, bell, and + stay pinned. */
  #tabbar {
    display: flex; gap: 6px; padding: 8px 8px 6px;
    overflow: hidden; flex: none;
    border-bottom: 1px solid var(--border); background: var(--bg2);
    align-items: center;
  }
  #tabs { overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 12px; border-radius: 8px; flex: none;
    background: var(--bg3); border: 1px solid var(--border);
    max-width: 60vw; cursor: pointer; user-select: none;
  }
  .tab.active { border-color: var(--accent); background: #1c2a41; }
  .tab .dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: var(--st-unknown);
  }
  .tab .dot.working { background: var(--st-working); animation: pulse 1.2s ease-in-out infinite; }
  .tab .dot.blocked { background: var(--st-blocked); animation: pulse 0.8s ease-in-out infinite; }
  .tab .dot.done { background: var(--st-done); }
  .tab .dot.idle { background: var(--st-idle); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .tab .lbl { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .sub { font-size: 10px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .tab .txt { min-width: 0; }
  .tab-btn {
    flex: none; width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg3); border: 1px solid var(--border); color: var(--fg-dim);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: #f85149; flex: none; margin-left: 2px; }
  #conn.ok { background: var(--st-working); animation: none; }
  #conn.degraded { background: var(--st-blocked); animation: pulse 1s ease-in-out infinite; }
  #attn {
    flex: none; align-items: center; gap: 5px; padding: 6px 10px; cursor: pointer;
    border-radius: 8px; background: var(--bg3); border: 1px solid var(--st-done);
    color: var(--st-done); font-size: 13px; font-weight: 600; user-select: none;
  }
  #attn.blocked { border-color: var(--st-blocked); color: var(--st-blocked); animation: pulse 1s ease-in-out infinite; }
  #toast {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--bg3); border: 1px solid var(--border); border-left: 4px solid var(--st-blocked);
    border-radius: 10px; padding: 10px 16px; font-size: 14px; display: none;
    max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.5); cursor: pointer;
  }
  #toast.show { display: block; }

  /* ---- terminal ---- */
  #termwrap { flex: 1; min-height: 0; position: relative; background: var(--bg); }
  #term {
    height: 100%; overflow-y: auto; overflow-x: auto;
    font-family: 'Cascadia Mono', 'Roboto Mono', ui-monospace, monospace;
    padding: 6px 4px; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    overflow-anchor: none; /* we manage scroll position explicitly */
  }
  #term .row { white-space: pre; line-height: 1.25; min-height: 1.25em; }
  #term .row span { white-space: pre; }
  .b { font-weight: 700; } .dim2 { opacity: 0.6; } .i { font-style: italic; }
  .u { text-decoration: underline; } .st { text-decoration: line-through; }
  /* Fixed-width cells for glyphs with font-dependent advance (spinner
     dingbats, symbols) — stops lines jumping as CC's spinner cycles. */
  #term .g { display: inline-block; width: 1ch; text-align: center; overflow: hidden; vertical-align: bottom; }
  #term .g2 { width: 2ch; }
  /* Always visible so the keys row never shifts; greyed when already live. */
  #livekey { color: var(--fg-dim); opacity: 0.55; }
  #livekey.show { color: var(--accent); border-color: var(--accent); opacity: 1; }
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: var(--fg-dim); font-size: 14px;
  }

  /* ---- preview / cast views ---- */
  #preview, #cast { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg); }
  #preview.show, #cast.show { display: flex; }

  /* On a wide screen there is room for both: the agent keeps working on the
     left while the real page it is building lives on the right. */
  @media (min-width: 900px) {
    #termwrap.split { display: flex; }
    #termwrap.split #term { width: 50%; height: 100%; }
    #termwrap.split #preview.show, #termwrap.split #cast.show {
      position: relative; inset: auto; width: 50%; border-left: 1px solid var(--border);
    }
  }
  .vbar {
    display: flex; gap: 6px; padding: 6px 8px; align-items: center; flex: none;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .vbar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 11px; border-radius: 7px; font-size: 12px; cursor: pointer;
    background: var(--bg3); border: 1px solid var(--border); color: var(--fg); user-select: none;
    white-space: nowrap;
  }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip .sub { color: var(--fg-dim); font-size: 10px; margin-left: 4px; }
  #pvframe { flex: 1; border: 0; width: 100%; background: #fff; }
  #casthost { flex: 1; position: relative; overflow: hidden; background: #000; touch-action: none; }
  #castimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #casthint, #pvhint {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    text-align: center; color: var(--fg-dim); font-size: 13px; padding: 0 24px; line-height: 1.6;
  }
  #castinput {
    flex: none; display: flex; gap: 6px; padding: 6px 8px; background: var(--bg2);
    border-top: 1px solid var(--border);
  }
  #castinput input {
    flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 15px; outline: none;
  }
  .row-link { color: var(--accent); text-decoration: underline; cursor: pointer; }

  /* ---- footer ---- */
  #footer { flex: none; background: var(--bg2); border-top: 1px solid var(--border); }
  #quickkeys {
    display: flex; gap: 6px; padding: 6px 8px 2px; overflow-x: auto; scrollbar-width: none;
  }
  #quickkeys::-webkit-scrollbar { display: none; }
  .qk {
    flex: none; padding: 8px 13px; border-radius: 8px; font-size: 13px;
    background: var(--bg3); border: 1px solid var(--border); color: var(--fg);
    cursor: pointer; user-select: none; font-family: ui-monospace, monospace;
  }
  .qk:active { background: #2c3440; }
  #inputrow { display: flex; gap: 8px; padding: 7px 8px 9px; align-items: flex-end; }
  #msg {
    flex: 1; min-height: 40px; max-height: 120px; resize: none;
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit;
    outline: none;
  }
  #msg:focus { border-color: var(--accent); }
  #send {
    flex: none; width: 44px; height: 44px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }

  /* ---- new session sheet ---- */
  #sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20;
  }
  #sheet.show { display: flex; align-items: flex-end; }
  #sheet .panel {
    background: var(--bg2); border-radius: 16px 16px 0 0; width: 100%;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 12px;
  }
  #sheet h2 { font-size: 15px; font-weight: 600; }
  #sheet input {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-size: 15px; width: 100%;
  }
  #sheet .actions { display: flex; gap: 10px; justify-content: flex-end; }
  #sheet button {
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg3); color: var(--fg); font-size: 14px; cursor: pointer;
  }
  #sheet button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="conn" title="connection"></div>
    <div id="attn" title="Next agent needing attention" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>0</span>
    </div>
    <div id="tabs" style="display:flex;gap:6px;"></div>
    <div class="tab-btn" id="pvbtn" title="Preview a local port">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
    </div>
    <div class="tab-btn" id="castbtn" title="Cast a real browser">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
    </div>
    <div class="tab-btn" id="newbtn" title="New session">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
  </div>

  <div id="termwrap">
    <div id="term"></div>

    <div id="preview">
      <div class="vbar" id="pvbar"></div>
      <iframe id="pvframe" title="preview" allow="clipboard-read; clipboard-write"></iframe>
      <div id="pvhint">Pick a local port above to preview it here.<br>Runs through this origin, so it gets HTTPS too.</div>
    </div>

    <div id="cast">
      <div class="vbar" id="castbar"></div>
      <div id="casthost">
        <img id="castimg" alt="browser cast">
        <div id="casthint">Attach to a Chrome DevTools endpoint to watch (and drive) a real browser — including the one your agent is automating.</div>
      </div>
      <div id="castinput">
        <input id="casturl" placeholder="Type here → sends to the page · or a URL to navigate" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="chip" id="castgo">Go</button>
      </div>
    </div>
    <div id="empty">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 9 3 3-3 3"/><line x1="12" y1="15" x2="17" y2="15"/></svg>
      <div>No session selected</div>
    </div>
  </div>

  <div id="footer">
    <div id="quickkeys"><div id="livekey" class="qk" tabindex="-1">↓ Live</div></div>
    <div id="inputrow">
      <textarea id="msg" rows="1" placeholder="Type to the agent…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button id="send" title="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="sheet">
    <div class="panel">
      <h2>New session</h2>
      <input id="ns-cwd" placeholder="Working directory (e.g. ~/projects/…)">
      <input id="ns-label" placeholder="Label (optional)">
      <input id="ns-cmd" placeholder="Command (optional, e.g. claude)">
      <div class="actions">
        <button id="ns-cancel">Cancel</button>
        <button id="ns-create" class="primary">Create</button>
      </div>
    </div>
  </div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// ANSI palette
// ---------------------------------------------------------------------------
const ANSI16 = ['#484f58','#ff7b72','#3fb950','#d29922','#58a6ff','#bc8cff','#39c5cf','#b1bac4',
                '#6e7681','#ffa198','#56d364','#e3b341','#79c0ff','#d2a8ff','#56d4dd','#f0f6fc'];
const PAL256 = (() => {
  const p = ANSI16.slice();
  const lv = [0, 95, 135, 175, 215, 255];
  for (let r = 0; r < 6; r++) for (let g = 0; g < 6; g++) for (let b = 0; b < 6; b++)
    p.push('#' + [lv[r], lv[g], lv[b]].map(v => v.toString(16).padStart(2, '0')).join(''));
  for (let i = 0; i < 24; i++) {
    const v = (8 + i * 10).toString(16).padStart(2, '0');
    p.push(`#${v}${v}${v}`);
  }
  return p;
})();
function colorOf(c) {
  if (!c) return null;
  if (c[0] === '#') return c;
  if (c[0] === 'a') return ANSI16[+c.slice(1)] || null;
  if (c[0] === 'x') return PAL256[+c.slice(1)] || null;
  return null;
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const term = $('term'), tabsEl = $('tabs'), histBadge = $('livekey'), emptyEl = $('empty');
let ws = null, wsOk = false;
let eventsDegraded = false, degradedCode = null; // herdr stopped feeding us events
let sessions = [];          // from server
let activePane = localStorage.getItem('herdr-web-pane') || null;
let liveRows = [];          // last live screen rows
let lastRecent = null;      // last scrollback fetch — rendered ABOVE the live block
let atBottom = true;        // view pinned to the live tail
let fontSize = +(localStorage.getItem('herdr-web-font') || 0); // 0 = auto

// One scroll container, two blocks: prefetched history above, live screen
// below. Scrolling into history is plain native scrolling — zero fetches on
// gesture (the fetch-on-swipe design stalled visibly on the phone).
const histEl = document.createElement('div');
const liveEl = document.createElement('div');
term.append(histEl, liveEl);

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
// Glyphs the monospace font renders at exactly 1 cell: ASCII + box drawing
// + block elements. Everything else (CC's spinner dingbats ✻✳✶, emoji,
// symbols…) has font-dependent width — as the spinner cycles glyphs, the
// rest of the line visibly jumps left/right. Pin those chars into
// fixed-width inline-block cells (1ch, or 2ch for East-Asian-wide/emoji).
const MONO_SAFE = /^[\x20-\x7E─-▟]*$/;
function charCells(cp) {
  return (
    (cp >= 0x1100 && cp <= 0x115F) || (cp >= 0x2E80 && cp <= 0xA4CF) ||
    (cp >= 0xAC00 && cp <= 0xD7A3) || (cp >= 0xF900 && cp <= 0xFAFF) ||
    (cp >= 0xFE30 && cp <= 0xFE4F) || (cp >= 0xFF00 && cp <= 0xFF60) ||
    (cp >= 0xFFE0 && cp <= 0xFFE6) || (cp >= 0x1F300 && cp <= 0x1FAFF) ||
    cp >= 0x20000
  ) ? 2 : 1;
}
// Local dev URLs in agent output become tap targets that open the preview —
// no modifier key, no typing the port.
const LOCAL_URL = /https?:\/\/(?:localhost|127\.0\.0\.1|0\.0\.0\.0)(?::(\d+))?(\/[^\s'"`)\]]*)?/g;
function appendLinkified(el, text) {
  LOCAL_URL.lastIndex = 0;
  let last = 0, m, found = false;
  while ((m = LOCAL_URL.exec(text))) {
    found = true;
    if (m.index > last) appendGlyphAware(el, text.slice(last, m.index));
    const a = document.createElement('span');
    a.className = 'row-link';
    a.textContent = m[0];
    const port = Number(m[1] || 80);
    const path = m[2] || '/';
    a.addEventListener('click', (e) => { e.stopPropagation(); openPreview(port, path); });
    el.appendChild(a);
    last = m.index + m[0].length;
  }
  if (!found) return false;
  if (last < text.length) appendGlyphAware(el, text.slice(last));
  return true;
}

function appendGlyphAware(el, text) {
  if (MONO_SAFE.test(text)) { el.appendChild(document.createTextNode(text)); return; }
  let run = '';
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    if (cp >= 0x20 && cp <= 0x7E || (cp >= 0x2500 && cp <= 0x259F)) { run += ch; continue; }
    if (run) { el.appendChild(document.createTextNode(run)); run = ''; }
    const g = document.createElement('span');
    g.className = 'g' + (charCells(cp) === 2 ? ' g2' : '');
    g.textContent = ch;
    el.appendChild(g);
  }
  if (run) el.appendChild(document.createTextNode(run));
}

function renderRow(spans) {
  const div = document.createElement('div');
  div.className = 'row';
  for (const s of spans) {
    const el = document.createElement('span');
    if (!appendLinkified(el, s.t)) appendGlyphAware(el, s.t);
    let fg = colorOf(s.f), bg = colorOf(s.g);
    if (s.m & 16) { const t = fg || '#e6edf3'; fg = bg || '#0d1117'; bg = t; }
    if (fg) el.style.color = fg;
    if (bg) el.style.backgroundColor = bg;
    let cls = '';
    if (s.m & 1) cls += ' b';
    if (s.m & 2) cls += ' dim2';
    if (s.m & 4) cls += ' i';
    if (s.m & 8) cls += ' u';
    if (s.m & 32) cls += ' st';
    if (cls) el.className = cls.trim();
    div.appendChild(el);
  }
  if (!spans.length) div.appendChild(document.createTextNode(' '));
  return div;
}

function renderInto(el, rows) {
  const frag = document.createDocumentFragment();
  for (const r of rows) frag.appendChild(renderRow(r));
  el.replaceChildren(frag);
}

function fitFont(rows) {
  if (fontSize) { term.style.fontSize = fontSize + 'px'; return; }
  let cols = 0;
  for (const r of rows) {
    let n = 0;
    for (const s of r) n += s.t.length;
    if (n > cols) cols = n;
  }
  cols = Math.max(cols, 40);
  // monospace advance ≈ 0.602em for common mono fonts
  const px = Math.floor((term.clientWidth - 8) / (cols * 0.602));
  term.style.fontSize = Math.max(7, Math.min(16, px)) + 'px';
}

function scrollToLive() {
  term.scrollTo({ top: term.scrollHeight, behavior: 'smooth' });
}
function pinBottom() { term.scrollTop = term.scrollHeight; }
function jumpLive() { // instant re-pin (used after sending input)
  atBottom = true;
  histBadge.classList.remove('show');
  renderHist();
  pinBottom();
}

function rowText(spans) {
  let t = '';
  for (const s of spans) t += s.t;
  return t.replace(/\s+$/, '');
}

// `recent` reads include the current screen at their tail; strip the part
// that overlaps the live block so the junction doesn't duplicate lines.
// Anchor on the TOP of the live screen (first non-empty lines) rather than
// suffix-matching the whole screen — lines below the top (spinners, timers)
// change between the two reads and a full-suffix match then under-cuts.
function cutOverlap(recentRows, live) {
  if (!live.length) return recentRows;
  const rt = recentRows.map(rowText), lt = live.map(rowText);
  const s = lt.findIndex((t) => t !== '');
  if (s < 0) return recentRows;
  const anchor = lt.slice(s, Math.min(s + 3, lt.length));
  for (let i = rt.length - anchor.length; i >= 0; i--) {
    let ok = true;
    for (let j = 0; j < anchor.length; j++) {
      if (rt[i + j] !== anchor[j]) { ok = false; break; }
    }
    if (ok) return recentRows.slice(0, Math.max(0, i - s));
  }
  return recentRows;
}

// History refreshes ONLY while pinned at bottom — a frozen history block is
// what keeps the reading position rock-stable while scrolled up.
function renderHist() {
  if (!atBottom || !lastRecent) return;
  renderInto(histEl, cutOverlap(lastRecent, liveRows));
  pinBottom();
}

let histFetchTimer = null;
function fetchHistSoon(delay = 1500) {
  if (histFetchTimer) return;
  histFetchTimer = setTimeout(() => {
    histFetchTimer = null;
    if (activePane && atBottom) send({ type: 'scrollback', pane: activePane, lines: 500 });
  }, delay);
}

function onScreen(rows) {
  liveRows = rows;
  renderInto(liveEl, rows);
  fitFont(rows);
  if (atBottom) pinBottom();
  fetchHistSoon(); // keep the junction fresh as lines scroll out of the screen
}

term.addEventListener('scroll', () => {
  const nowAtBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 8;
  if (nowAtBottom === atBottom) return;
  atBottom = nowAtBottom;
  histBadge.classList.toggle('show', !atBottom);
  if (atBottom) { renderHist(); fetchHistSoon(200); }
});
histBadge.addEventListener('mousedown', (e) => e.preventDefault());
histBadge.addEventListener('click', scrollToLive);

// ---------------------------------------------------------------------------
// Viewport fit -> drive the herdr runtime size (tmux-web-style readable width)
// ---------------------------------------------------------------------------
const TARGET_FONT = 13;   // comfortable phone font; server resizes herdr to fit
const LINE_H = 1.25;
function measureCharW(px) {
  const c = measureCharW._ctx || (measureCharW._ctx = document.createElement('canvas').getContext('2d'));
  c.font = `${px}px 'Cascadia Mono', 'Roboto Mono', ui-monospace, monospace`;

      send({ type: 'scrollback', pane: activePane, lines: 500 }); // prefetch

// Map a tap on the letterboxed <img> back to page pixels.
function castPoint(e) {
  const img = $('castimg');
  const r = img.getBoundingClientRect();
  if (!castNat.w || !castNat.h) return null;
  const scale = Math.min(r.width / castNat.w, r.height / castNat.h);
  const dw = castNat.w * scale, dh = castNat.h * scale;
  const x = (e.clientX - r.left - (r.width - dw) / 2) / scale;
  const y = (e.clientY - r.top - (r.height - dh) / 2) / scale;
  if (x < 0 || y < 0 || x > castNat.w || y > castNat.h) return null;
  return { x: Math.round(x), y: Math.round(y) };
}
let castDrag = null;
$('casthost').addEventListener('touchstart', (e) => {
  const p = castPoint(e.touches[0]);
  castDrag = p ? { ...p, t: Date.now(), moved: 0 } : null;
}, { passive: true });
$('casthost').addEventListener('touchmove', (e) => {
  if (!castDrag) return;
  const p = castPoint(e.touches[0]);
  if (!p) return;
  const dy = castDrag.y - p.y;
  castDrag.moved += Math.abs(dy);
  if (Math.abs(dy) > 1) { castSend({ type: 'scroll', x: p.x, y: p.y, dy }); castDrag.y = p.y; }
}, { passive: true });
$('casthost').addEventListener('touchend', () => {
  if (castDrag && castDrag.moved < 8 && Date.now() - castDrag.t < 500) {
    castTap(castDrag.x, castDrag.y);
  }
  castDrag = null;
});
$('casthost').addEventListener('click', (e) => {
  if (e.pointerType === 'touch' || !castNat.w) return;
  const p = castPoint(e);
  if (p) castTap(p.x, p.y);
});
// One tap, two meanings: pick the element, or click it.
function castTap(x, y) {
  castSend(castPick ? { type: 'pick', x, y } : { type: 'mouse', action: 'click', x, y });
}
$('casthost').addEventListener('wheel', (e) => {
  const p = castPoint(e);
  if (p) castSend({ type: 'scroll', ...p, dy: e.deltaY });
}, { passive: true });
$('castbtn').addEventListener('click', () => {
  if (view === 'cast') { setView('term'); return; }
  // A live session keeps its mode, errors and target — just show it again.
  if (castWs?.readyState === 1) { setView('cast'); return; }
  openCast();
});
$('castgo').addEventListener('mousedown', (e) => e.preventDefault());
$('castgo').addEventListener('click', castSubmit);
$('casturl').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); castSubmit(); } });
function castSubmit() {
  const v = $('casturl').value.trim();
  if (!v) { castSend({ type: 'key', key: 'Enter' }); return; }
  if (/^https?:\/\//.test(v) || /^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(v) || /^localhost(:\d+)?/.test(v)) {
    castSend({ type: 'navigate', url: /^https?:\/\//.test(v) ? v : 'http://' + v });
  } else {
    castSend({ type: 'text', text: v });
    castSend({ type: 'key', key: 'Enter' });
  }
  $('casturl').value = '';
}

// PWA service worker
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
